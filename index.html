<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Monitor - Rubens Cherubini Alves</title>
    <!-- Fonte Poppins - Identidade Équora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta Équora - Full Deep Night Style */
            --deep-night: #1C2632;      /* Fundo Principal */
            --deep-night-card: #131B24; /* Containers e Cards */
            --terra-cotta: #7D3915;     /* Acentos Fortes e Destaques Primários */
            --burnt-sienna: #B1743D;    /* Bordas e Acentos Secundários */
            --soft-gold: #FECB78;       /* Texto de Destaque e Relógio */
            --ivory-mist: #EDE9DE;      /* Texto Principal */
            --text-muted: #9C9C95;      /* Texto Secundário */
            --border-color: #2F3B49;    /* Bordas Sutis Azul-Aço */
        }

        body { 
            background-color: var(--deep-night); 
            color: var(--ivory-mist); 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        .ticker-wrap { height: 40px; background: #111720; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }

        nav { display: flex; background: #111720; border-bottom: 2px solid var(--terra-cotta); padding: 10px 20px 0; gap: 8px; flex-shrink: 0; }
        .tab-button { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--border-color); 
            border-bottom: none; 
            color: var(--ivory-mist); 
            padding: 8px 18px; 
            cursor: pointer; 
            border-radius: 6px 6px 0 0; 
            font-size: 0.75rem; 
            font-weight: 500; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .tab-button.active { 
            background: linear-gradient(135deg, var(--terra-cotta), var(--burnt-sienna)); 
            color: #FFFFFF; 
            border-color: var(--terra-cotta); 
            font-weight: 600;
        }

        .tab-content { display: none; flex-grow: 1; flex-direction: column; padding: 12px 18px; overflow-y: auto; }
        .tab-content.active { display: flex; }

        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; flex-shrink: 0; }
        .controls { display: flex; gap: 8px; align-items: center; }
        input { 
            background: var(--deep-night-card); 
            border: 1px solid var(--border-color); 
            color: var(--ivory-mist); 
            padding: 6px 10px; 
            border-radius: 6px; 
            outline: none; 
            width: 120px; 
            font-size: 0.75rem; 
            font-family: 'Poppins', sans-serif;
        }
        input::placeholder { color: var(--text-muted); }
        
        button { 
            background: var(--terra-cotta); 
            border: none; 
            color: #FFFFFF; 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.75rem; 
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s ease;
        }
        button:hover { background: var(--burnt-sienna); }
        
        #live-clock { font-size: 0.85rem; color: var(--soft-gold); font-weight: 600; font-family: 'Poppins', monospace; }

        .grid-indices { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 15px; padding-bottom: 40px; }
        .widget-index-box { height: 450px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--deep-night-card); }
        
        .grid-cards { display: flex; gap: 10px; margin-bottom: 12px; flex-shrink: 0; overflow-x: auto; padding-bottom: 5px; }
        .card-widget { min-width: 165px; background: var(--deep-night-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); height: 82px; }

        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; flex-grow: 1; min-height: 0; }
        .chart-box { background: var(--deep-night-card); border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .chart-header { background: #111720; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .chart-header span { font-size: 0.7rem; color: var(--soft-gold); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .chart-header input { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #FFFFFF; padding: 2px 6px; width: 90px; }
        .chart-wrapper { flex-grow: 1; }

        /* Altura expandida para 780px acomodando todos os ativos da B3 */
        .widget-wrapper-b3 { width: 100%; height: 780px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--deep-night-card); }
        .tables-container { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; padding: 10px 0 50px; }
        .table-section { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 800px; }

        footer { 
            background: #111720; 
            border-top: 1px solid var(--burnt-sienna); 
            padding: 8px 20px; 
            text-align: center; 
            font-size: 0.75rem; 
            color: var(--ivory-mist);
            flex-shrink: 0; 
        }
        footer a { color: var(--soft-gold); text-decoration: none; font-weight: 600; margin-left: 5px; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
                "symbols": [
                    {"proName": "VANTAGE:SP500", "title": "S&P 500"},{"proName": "BMFBOVESPA:IBOV", "title": "Ibovespa"},
                    {"proName": "FX_IDC:USDBRL", "title": "USD/BRL"},{"proName": "FX_IDC:EURBRL", "title": "EUR/BRL"},{"proName": "FX_IDC:USDUYU", "title": "USD/UYU"},{"proName": "FX_IDC:UYUBRL", "title": "UYU/BRL"},
                    {"proName": "COINBASE:BTCUSD", "title": "BTC/USD"},{"proName": "BINANCE:BTCBRL", "title": "BTC/BRL"}
                ],
                "showSymbolLogo": true, "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "br"
            }
            </script>
        </div>
    </div>

    <nav>
        <button class="tab-button active" onclick="openTab(event, 'tab1')">Wealth Monitor</button>
        <button class="tab-button" onclick="openTab(event, 'tab2')">Carteira B3</button>
        <button class="tab-button" onclick="openTab(event, 'tab3')">Índices Mercado</button>
    </nav>

    <div id="tab1" class="tab-content active">
        <header>
            <div class="controls"><input type="text" id="inputCard" placeholder="Add Card"><button onclick="addCard()">+</button><button onclick="resetCards()" style="background:#111720">RESET</button></div>
            <div id="live-clock">--:--:--</div>
        </header>
        <div class="grid-cards" id="container-cards"></div>
        <div class="grid-charts">
            <div class="chart-box"><div class="chart-header"><span id="title_1">IBOV</span><input type="text" onchange="updateChart(1, this.value)"></div><div id="tv_chart_1" class="chart-wrapper"></div></div>
            <div class="chart-box"><div class="chart-header"><span id="title_2">S&P 500</span><input type="text" onchange="updateChart(2, this.value)"></div><div id="tv_chart_2" class="chart-wrapper"></div></div>
            <div class="chart-box"><div class="chart-header"><span id="title_3">BTC/USD (COINBASE)</span><input type="text" onchange="updateChart(3, this.value)"></div><div id="tv_chart_3" class="chart-wrapper"></div></div>
            <div class="chart-box"><div class="chart-header"><span id="title_4">OURO (GOLD)</span><input type="text" onchange="updateChart(4, this.value)"></div><div id="tv_chart_4" class="chart-wrapper"></div></div>
        </div>
    </div>

    <div id="tab2" class="tab-content">
        <header><div class="controls"><span style="font-size:0.85rem; color:var(--soft-gold); font-weight:600;">AÇÕES & FIIs</span><button onclick="resetTab2()" style="background:#111720">RESET DEFAULT</button></div></header>
        <div class="tables-container">
            <div class="table-section">
                <div class="controls"><input type="text" id="inputAcao" placeholder="Adicionar Ação"><button onclick="addToTable('acoes')">+</button></div>
                <div class="widget-wrapper-b3" id="container-acoes"></div>
            </div>
            <div class="table-section">
                <div class="controls"><input type="text" id="inputFii" placeholder="Adicionar FII"><button onclick="addToTable('fiis')">+</button></div>
                <div class="widget-wrapper-b3" id="container-fiis"></div>
            </div>
        </div>
    </div>

    <div id="tab3" class="tab-content">
        <header><span style="font-size:0.85rem; color:var(--soft-gold); font-weight:600;">MACRO INDICATORS - GLOBAL VIEW</span></header>
        <div class="grid-indices">
            <div class="widget-index-box" id="idx-equity"></div>
            <div class="widget-index-box" id="idx-commos"></div>
            <div class="widget-index-box" id="idx-juros-int"></div>
            <div class="widget-index-box" id="idx-juros-br"></div>
        </div>
    </div>

    <footer>
        Desenvolvido por Rubens Cherubini Alves | 
        <a href="https://www.instagram.com/acoes.inteligentes" target="_blank">@acoes.inteligentes</a>
    </footer>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let cardsList = JSON.parse(localStorage.getItem('cardsList')) || ["FX_IDC:USDBRL", "BMFBOVESPA:IBOV", "AMEX:EWZ", "BMFBOVESPA:IVVB11", "AMEX:IVV", "COINBASE:BTCUSD", "BMFBOVESPA:GOLD11"];
        let listaAcoes = JSON.parse(localStorage.getItem('listaAcoes')) || ["BMFBOVESPA:ENEV3", "BMFBOVESPA:PASS3", "BMFBOVESPA:GGPS3", "BMFBOVESPA:EQTL3", "BMFBOVESPA:ALUP11", "BMFBOVESPA:RENT3", "BMFBOVESPA:RDOR3", "BMFBOVESPA:IGTI11", "BMFBOVESPA:TTEN3", "BMFBOVESPA:PETR4", "BMFBOVESPA:BOVA11", "BMFBOVESPA:NSDV11", "BMFBOVESPA:LVOL11", "BMFBOVESPA:DIVO11"];
        let listaFiis = JSON.parse(localStorage.getItem('listaFiis')) || ["BMFBOVESPA:KFOF11", "BMFBOVESPA:HGBS11", "BMFBOVESPA:HDOF11", "BMFBOVESPA:HLOG11", "BMFBOVESPA:CJCT11", "BMFBOVESPA:PPEI11", "BMFBOVESPA:HRDF11", "BMFBOVESPA:SEED11", "BMFBOVESPA:BDIV11", "BMFBOVESPA:KNHY11", "BMFBOVESPA:RPRI11"];

        const listEquity = [
            {"name": "IBOV", "description": "Ibovespa"},
            {"name": "SMAL11", "description": "Small Caps BR"},
            {"name": "EWZ", "description": "Brasil (EWZ)"},
            {"name": "ACWI", "description": "Global (ACWI)"},
            {"name": "SPY", "description": "S&P 500 (SPY)"},
            {"name": "QQQ", "description": "Nasdaq 100 (QQQ)"},
            {"name": "IWM", "description": "Russell 2000 (IWM)"},
            {"name": "EEM", "description": "Emerging Markets"},
            {"name": "VIX", "description": "VIX Index"}
        ];
        
        const listCommos = [
            {"name": "DBC", "description": "Commodity Index"},
            {"name": "CPER", "description": "Cobre (Metal Base)"},
            {"name": "SOYB", "description": "Soja (ETF SOYB)"},
            {"name": "COW", "description": "Boi Gordo (ETF COW)"},
            {"name": "TVC:UKOIL", "description": "Petróleo Brent"},
            {"name": "DBA", "description": "Cesta Agrícola (DBA)"},
            {"name": "DXY", "description": "Dólar Index"},
            {"name": "TVC:GOLD", "description": "Ouro (US$ / OZ)"},
            {"name": "COINBASE:BTCUSD", "description": "Bitcoin (Coinbase)"}
        ];

        const listJurosInt = [
            {"name": "BIL", "description": "T-Bill < 1Y"},
            {"name": "SHY", "description": "Treasury 1-3Y"},
            {"name": "IEF", "description": "Treasury 7-10Y"},
            {"name": "TLT", "description": "Treasury 20Y+"},
            {"name": "TIP", "description": "Inflação/Real (TIP)"},
            {"name": "LQD", "description": "Investment Grade"},
            {"name": "HYG", "description": "High Yield"}
        ];

        const listJurosBr = [
            {"name": "DI1F2027", "description": "DI 2027"},
            {"name": "DI1F2029", "description": "DI 2029"},
            {"name": "DI1F2031", "description": "DI 2031"},
            {"name": "DI1F2033", "description": "DI 2033"},
            {"name": "B5P211", "description": "B5P2 (IMA-B Curto)"},
            {"name": "IMAB11", "description": "IMAB11 (IMA-B)"},
            {"name": "B5MB11", "description": "B5MB (IMA-B Longo)"}
        ];

        function openTab(evt, tabName) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(tb => tb.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function renderIndexTable(containerId, title, list) {
            const container = document.getElementById(containerId);
            if(!container) return; container.innerHTML = '';
            const script = document.createElement('script'); script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js';
            script.async = true;
            const symbols = list.map(item => ({"name": item.name, "displayName": item.description}));
            script.text = JSON.stringify({ "width": "100%", "height": "100%", "symbolsGroups": [{ "name": title, "symbols": symbols }], "showSymbolLogo": true, "colorTheme": "dark", "isTransparent": true, "locale": "br" });
            container.appendChild(script);
        }

        function addToTable(type) {
            const inputId = type === 'acoes' ? 'inputAcao' : 'inputFii';
            const val = document.getElementById(inputId).value.toUpperCase().trim();
            if (val) {
                const f = (val.length <= 6 && !val.includes(':')) ? `BMFBOVESPA:${val}` : val;
                if (type === 'acoes') {
                    listaAcoes.push(f); localStorage.setItem('listaAcoes', JSON.stringify(listaAcoes));
                    renderIndexTable("container-acoes", "AÇÕES", listaAcoes.map(s => ({"name": s, "description": s.replace("BMFBOVESPA:", "")})));
                } else {
                    listaFiis.push(f); localStorage.setItem('listaFiis', JSON.stringify(listaFiis));
                    renderIndexTable("container-fiis", "FIIs", listaFiis.map(s => ({"name": s, "description": s.replace("BMFBOVESPA:", "")})));
                }
                document.getElementById(inputId).value = '';
            }
        }

        function updateChart(id, ticker) {
            ticker = ticker.toUpperCase().trim(); if (!ticker) return;
            let f = (ticker.length <= 6 && !ticker.includes(':')) ? `BMFBOVESPA:${ticker}` : ticker;
            
            if(["VANTAGE:SP500", "GOLD", "COINBASE:BTCUSD", "SOYB", "COW"].includes(ticker)) f = ticker;
            if(ticker === "BTCUSD" || ticker === "BTC/USD") f = "COINBASE:BTCUSD";

            document.getElementById(`tv_chart_${id}`).innerHTML = ''; 
            new TradingView.widget({ "autosize": true, "symbol": f, "interval": "D", "theme": "dark", "style": "1", "locale": "br", "hide_top_toolbar": true, "container_id": `tv_chart_${id}` });
        }

        function renderCards() {
            const container = document.getElementById('container-cards'); container.innerHTML = '';
            cardsList.forEach((symbol) => {
                const div = document.createElement('div'); div.className = 'card-widget'; container.appendChild(div);
                const script = document.createElement('script'); script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';
                script.async = true; script.text = JSON.stringify({ "symbol": symbol, "width": "100%", "colorTheme": "dark", "isTransparent": true, "locale": "br" });
                div.appendChild(script);
            });
        }

        function addCard() {
            const val = document.getElementById('inputCard').value.toUpperCase().trim();
            if (val) {
                const f = (val.length <= 6 && !val.includes(':')) ? `BMFBOVESPA:${val}` : val;
                cardsList.push(f); localStorage.setItem('cardsList', JSON.stringify(cardsList)); renderCards();
                document.getElementById('inputCard').value = '';
            }
        }

        function resetCards() { localStorage.removeItem('cardsList'); location.reload(); }
        function resetTab2() { localStorage.removeItem('listaAcoes'); localStorage.removeItem('listaFiis'); location.reload(); }
        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('pt-BR'); }, 1000);

        window.onload = () => {
            renderCards();
            renderIndexTable("container-acoes", "AÇÕES", listaAcoes.map(s => ({"name": s, "description": s.replace("BMFBOVESPA:", "")})));
            renderIndexTable("container-fiis", "FIIs", listaFiis.map(s => ({"name": s, "description": s.replace("BMFBOVESPA:", "")})));
            renderIndexTable("idx-equity", "EQUITY", listEquity);
            renderIndexTable("idx-commos", "COMMODITIES", listCommos);
            renderIndexTable("idx-juros-int", "JUROS INTERNACIONAL", listJurosInt);
            renderIndexTable("idx-juros-br", "JUROS BRASIL", listJurosBr);
            updateChart(1, "BMFBOVESPA:IBOV"); updateChart(2, "VANTAGE:SP500"); updateChart(3, "COINBASE:BTCUSD"); updateChart(4, "GOLD");
        };
    </script>
</body>
</html>
